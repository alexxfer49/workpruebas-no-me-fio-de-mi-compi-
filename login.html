<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Acceso de usuarios</title>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="js/supabase-config.js"></script>
<script src="js/ui.js"></script>
<script src="js/auth.js"></script>
    <link rel="stylesheet" href="css/formulario.css">
</head>

<body>

    <div class="contenedor">

        <h1>Bienvenido</h1>
        <p>Accede a tu cuenta o crea una nueva.</p>

        <!-- Botones para cambiar de apartado -->
        <div class="pestanas">
            <button type="button" id="botonRegistro" class="activo">
                Registro
            </button>

            <button type="button" id="botonLogin">
                Iniciar sesión
            </button>
        </div>

        <!-- APARTADO REGISTRO -->
        <form id="formularioRegistro">

            <h2>Crear cuenta</h2>

            <label for="nombre">Nombre *</label>
            <input type="text" id="nombre" required>

            <label for="apellidos">Apellidos *</label>
            <input type="text" id="apellidos" required>

            <label for="correoRegistro">Correo electrónico *</label>
            <input type="email" id="correoRegistro" required>

            <label for="telefono">Teléfono *</label>
            <input type="tel" id="telefono"
                   pattern="[0-9]{9}"
                   title="Escribe 9 números sin espacios"
                   required>

            <label for="contrasenaRegistro">Contraseña *</label>
            <input type="password" id="contrasenaRegistro"
                   minlength="6" required>

            <button type="submit">Registrarse</button>

        </form>

        <!-- APARTADO LOGIN -->
        <form id="formularioLogin" style="display: none;">

            <h2>Iniciar sesión</h2>

            <label for="correoLogin">Correo electrónico *</label>
            <input type="email" id="correoLogin" required>

            <label for="contrasenaLogin">Contraseña *</label>
            <input type="password" id="contrasenaLogin" required>

            <button type="submit">Entrar</button>

        </form>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="script.js"></script>

</body>
</html>
